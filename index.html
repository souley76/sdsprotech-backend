<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SDS PRO - Smartphones Premium</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#020912] text-white font-sans">

  <!-- Header / Navigation -->
  <nav class="sticky top-0 z-30 border-b border-white/10 bg-[#020912]/80 backdrop-blur-xl">
    <div class="mx-auto flex max-w-[1400px] items-center justify-between px-6 py-4 lg:px-12">
      <div class="flex items-center gap-3">
        <img src="/logo-sds.svg" alt="SDS PRO" class="h-10 w-auto" />
        <span class="hidden text-sm font-bold tracking-[0.3em] text-white sm:inline-flex">SDS PRO</span>
      </div>
      <div class="hidden items-center gap-4 text-sm text-slate-300 lg:flex">
        <a href="#cat" class="transition hover:text-cyan-300">Catalogue</a>
        <a href="#cat" class="transition hover:text-cyan-300">iPhone</a>
        <a href="#cat" class="transition hover:text-cyan-300">Samsung</a>
        <a href="#pay" class="transition hover:text-cyan-300">Paiement</a>
        <a href="/accessoires.html" class="transition hover:text-cyan-300">🎧 Accessoires</a>
        <a href="/ordinateurs.html" class="transition hover:text-cyan-300">💻 Ordinateurs</a>
      </div>
      <button class="rounded-2xl border border-white/10 bg-white/5 px-4 py-2 text-sm text-white transition hover:bg-white/10">
        👤 Connexion
      </button>
    </div>
  </nav>

  <!-- Hero Section -->
  <section class="relative min-h-screen overflow-hidden bg-black">
    <div class="relative z-10 mx-auto flex min-h-screen max-w-[1400px] flex-col justify-center px-6 py-16 lg:px-12">
      <div class="mx-auto flex w-full max-w-6xl flex-col gap-12">
        <div class="rounded-[32px] border border-white/10 bg-white/5 p-6 shadow-[0_40px_120px_rgba(0,0,0,0.4)] backdrop-blur-xl md:p-10">
          <div class="flex flex-col gap-6 lg:flex-row lg:items-center lg:justify-between">
            <div class="space-y-3 text-center lg:text-left">
              <div class="text-sm uppercase tracking-[0.3em] text-cyan-300/80">Catalogue 2025-2026</div>
              <h1 class="text-4xl font-black tracking-tight text-white sm:text-5xl lg:text-6xl">
                Les Meilleurs <span class="block">Smartphones</span>
                <span class="block text-cyan-400">Premium</span>
              </h1>
              <p class="max-w-2xl text-sm leading-7 text-slate-300 sm:text-base">
                iPhones · Infinix · Tecno de dernière génération. Livrés chez vous à Dakar.
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

</body>
</html>
