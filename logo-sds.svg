<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" fill="none">
  <defs>
    <!-- Dégradé principal SDS (bleu -> cyan -> glow) -->
    <linearGradient id="sdsGrad" x1="40" y1="60" x2="200" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0055ff"/>
      <stop offset="0.5" stop-color="#00c8ff"/>
      <stop offset="1" stop-color="#00e5ff"/>
    </linearGradient>
    <!-- Dégradé anneau -->
    <linearGradient id="ringGrad" x1="20" y1="20" x2="220" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="0.55" stop-color="#0055ff"/>
      <stop offset="1" stop-color="#003a8c"/>
    </linearGradient>
    <!-- Fond intérieur -->
    <radialGradient id="coreGrad" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#06203c"/>
      <stop offset="0.7" stop-color="#040f1e"/>
      <stop offset="1" stop-color="#020912"/>
    </radialGradient>
    <!-- Glow filter -->
    <filter id="neon" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- Halo lumineux derrière -->
  <circle cx="120" cy="124" r="92" fill="#00c8ff" opacity="0.18" filter="url(#softGlow)"/>

  <!-- Anneau extérieur -->
  <circle cx="120" cy="124" r="84" fill="url(#coreGrad)" stroke="url(#ringGrad)" stroke-width="5"/>
  <circle cx="120" cy="124" r="84" fill="none" stroke="#00e5ff" stroke-width="1" opacity="0.5" filter="url(#neon)"/>
  <!-- Anneau intérieur fin -->
  <circle cx="120" cy="124" r="73" fill="none" stroke="#0aa6e8" stroke-width="1" opacity="0.35"/>

  <!-- Couronne (crown) en haut -->
  <g filter="url(#neon)">
    <path d="M120 14
             L131 33 L150 22 L146 46
             L94 46 L90 22 L109 33 Z"
          fill="url(#sdsGrad)"/>
    <circle cx="120" cy="11" r="4.5" fill="#00e5ff"/>
    <circle cx="150" cy="20" r="3.5" fill="#00c8ff"/>
    <circle cx="90" cy="20" r="3.5" fill="#00c8ff"/>
  </g>

  <!-- Texte SDS -->
  <text x="120" y="138"
        font-family="'Rajdhani','Arial Black',sans-serif"
        font-size="62" font-weight="700" letter-spacing="2"
        text-anchor="middle" fill="url(#sdsGrad)"
        filter="url(#neon)">SDS</text>

  <!-- Badge PRO -->
  <g>
    <rect x="86" y="150" width="68" height="24" rx="12"
          fill="#020912" stroke="url(#sdsGrad)" stroke-width="2"/>
    <text x="120" y="167"
          font-family="'Rajdhani','Arial',sans-serif"
          font-size="15" font-weight="700" letter-spacing="5"
          text-anchor="middle" fill="#00e5ff">PRO</text>
  </g>

  <!-- Chevron bas (pointe diamant) -->
  <g filter="url(#neon)">
    <path d="M104 188 L120 206 L136 188 Z" fill="url(#sdsGrad)"/>
  </g>
</svg>
